services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/prod-explore/climbing-booking:${CLIMBING_BOOKING_IMAGE_TAG:-latest}
    container_name: climbing-booking-app
    restart: unless-stopped

    env_file: .env
    # Set here so a development .env cannot switch them: the container always runs in production mode,
    # on the port the healthcheck expects, with the database on the volume.
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/climbing-booking.db

    volumes:
      - climbing_booking_data:/app/data

    # No port is published on the host. The reverse proxy joins `climbing-booking-network` and reaches the app at
    # climbing-booking-app:3000 (see the README). To open it on localhost while developing, copy
    # docker-compose.override.example.yml to docker-compose.override.yml.

    networks:
      - climbing-booking-network

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  climbing-booking-network:
    name: climbing-booking-network
    driver: bridge

volumes:
  climbing_booking_data:
    name: climbing_booking_data
    driver: local
