services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: climbing-booking-app
    restart: unless-stopped

    env_file: .env
    # Set here so a development .env cannot switch them: the container always runs in production mode,
    # on the port the healthcheck and the mapping below expect, with the database on the volume.
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/climbing-booking.db

    volumes:
      - climbing_booking_data:/app/data

    # Published on the loopback interface only: put a TLS-terminating reverse proxy in front of it
    # (or attach the proxy to climbing-booking-network and drop this mapping).
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"

    networks:
      - climbing-booking-network

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  climbing-booking-network:
    name: climbing-booking-network
    driver: bridge

volumes:
  climbing_booking_data:
    name: climbing_booking_data
    driver: local
