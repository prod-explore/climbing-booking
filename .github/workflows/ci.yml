name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t climbing-booking .
      - name: Start it and wait for the health check
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e APP_URL=http://localhost:3000 \
            climbing-booking
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
